<div class="container mt-4">
    <h1>Productos</h1>
    <div class="d-flex justify-content-center mb-3">
        <button mat-raised-button color="primary" (click)>
            <mat-icon>add</mat-icon> Agregar producto
        </button>
    </div>

    <mat-form-field appearance="fill" class="w-100">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="filtroProducto($event)" placeholder="Buscar Producto...">
    </mat-form-field>

    <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 w-100">
            <ng-container matColumnDef="detalles">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let Producto">
                    <button mat-icon-button color="primary" (click)="abrirModalDetalles(producto)">
                        <mat-icon>visibility</mat-icon>
                    </button>
                </td>
            </ng-container>
            <ng-container matColumnDef="idProducto">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="">ID</th>
                <td mat-cell *matCellDef="let l">{{ l.idProducto }}</td>
            </ng-container>
            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="">Nombre</th>
                <td mat-cell *matCellDef="let l">{{ l.nombre }}</td>
            </ng-container>
            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="">Descripción</th>
                <td mat-cell *matCellDef="let l">{{ l.descripcion }}</td>
            </ng-container>
            <ng-container matColumnDef="precio">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
                <td mat-cell *matCellDef="let l">{{ l.precio }}</td>
            </ng-container>
            <ng-container matColumnDef="stock">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
                <td mat-cell *matCellDef="let l">{{ l.stock }}</td>
            </ng-container>
            <ng-container matColumnDef="tipoPorducto">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo de Porducto</th>
                <td mat-cell *matCellDef="let l">{{ l.tipoPorducto }}</td>
            </ng-container>
        </table>
    </div>

</div>
